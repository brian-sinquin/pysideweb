[project]
name = "pysideweb"
version = "0.1.0"
description = "Intercept PySide6 API calls and render the UI in a web browser"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PySideWeb Contributors" }]
keywords = ["pyside6", "qt", "gui", "web", "websocket", "aiohttp", "ui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Widget Sets",
]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/brian-sinquin/pysideweb"
Repository = "https://github.com/brian-sinquin/pysideweb"
Issues = "https://github.com/brian-sinquin/pysideweb/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysideweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# E501: long lines are fine.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# In examples, `import pysideweb` MUST come before any PySide6 import (it is imported
# for its import-time side effect). Disable import sorting/unused/order rules there so
# tooling never reorders or removes that line.
"examples/*" = ["E402", "F401", "I001"]
"benchmarks/*" = ["E402", "F401", "I001"]
"tests/*" = ["E402"]
"tests_browser/*" = ["E402", "F401", "I001"]
"tests_qt/*" = ["E402"]
