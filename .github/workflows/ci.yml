name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (with dev extras)
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  crosscheck:
    name: Reference values vs real PySide6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"

      - name: Install real PySide6 + pytest in an isolated venv
        run: |
          uv venv .venv-qt
          uv pip install --python .venv-qt pyside6 pytest

      - name: Cross-check pysideweb's reference values against genuine Qt
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv-qt/bin/python -m pytest -q tests_qt/
